<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Dear Army</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Confetti Background -->
  <div class="confetti"></div>

  <!-- Floating Hearts -->
  <div class="hearts"></div>

  <!-- Main Content -->
  <div class="container">

    <h1 class="title">🎉 Happy Birthday 🎉</h1>
    <h2 class="name">My Chingu ❤️</h2>
    <h3 class="age">✨ 21 Years of Amazingness ✨</h3>

    <p class="typing" id="typingText"></p>
    <button class="surprise-btn" onclick="showSurprise()">
  🎁 Click for Surprise 💖
</button>

<p id="surpriseMsg" class="surprise-msg"></p>

    <!-- Animated Cake -->
    <div class="cake-container">
      <div class="cake">
        <div class="candle">
          <div class="flame"></div>
        </div>

        <div class="cake-layer layer3"></div>
        <div class="cake-layer layer2"></div>
        <div class="cake-layer layer1"></div>

        <div class="plate"></div>
      </div>
    </div>

    <p class="footer">💖 You made my life so Beautiful 💖</p>

  </div>

  <script src="script.js"></script>
</body>
</html>
